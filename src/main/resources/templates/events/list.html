<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events — Campus Event Tracker</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
</head>

<body>

    <nav th:replace="~{layout/base :: navbar}"></nav>

    <div class="container">
        <!-- #9 — Flash messages with close button -->
        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
            <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
        </div>
        <div th:if="${error}" class="alert alert-error">
            <span th:text="${error}"></span>
            <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
        </div>

        <h1 class="page-title">Upcoming Events</h1>

        <!-- Search bar -->
        <form th:action="@{/events}" method="get" class="search-bar">
            <input type="text" name="q" th:value="${q}" placeholder="Search events..." class="search-input" />
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <!-- #7 — Category filter pills -->
        <div class="category-filters">
            <a th:href="@{/events}" class="category-pill" th:classappend="${category == null} ? 'active' : ''">All</a>
            <a th:each="cat : ${categories}" th:href="@{/events(category=${cat})}" th:text="${cat}"
                class="category-pill" th:classappend="${category == cat} ? 'active' : ''">Category</a>
        </div>

        <!-- Event cards grid -->
        <div class="event-grid" th:if="${!events.content.isEmpty()}">
            <div th:each="event : ${events.content}" class="event-card">
                <div class="event-card-header">
                    <span class="event-category" th:text="${event.category}">Category</span>
                </div>
                <h3 class="event-title" th:text="${event.title}">Event Title</h3>
                <div class="event-meta">
                    <p class="event-date">
                        📅 <span th:text="${#temporals.format(event.startTime, 'MMM dd, yyyy h:mm a')}">Date</span>
                    </p>
                    <p class="event-location">
                        📍 <span th:text="${event.location}">Location</span>
                    </p>
                    <p class="event-attendees">
                        👥 <span th:text="${event.attendeeCount}">0</span> attending
                        <span th:if="${event.capacity != null}">
                            / <span th:text="${event.capacity}">∞</span>
                        </span>
                    </p>
                    <div th:if="${event.capacity != null}" class="capacity-bar-wrapper">
                        <div class="capacity-bar"
                             th:with="pct=${event.attendeeCount * 100 / event.capacity}"
                             th:classappend="${pct >= 90} ? 'capacity-critical' : (${pct >= 60} ? 'capacity-warning' : 'capacity-ok')"
                             th:style="'width: ' + ${pct > 100 ? 100 : pct} + '%'">
                        </div>
                    </div>
                </div>
                <div class="event-tags" th:if="${!event.tags.isEmpty()}">
                    <a th:each="t : ${event.tags}"
                       th:href="@{/events(tag=${t})}"
                       th:text="${t}"
                       class="event-tag"
                       th:classappend="${tag == t} ? ' active' : ''"></a>
                </div>
                <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline">View Details →</a>
            </div>
        </div>

        <!-- Empty state -->
        <div class="empty-state" th:if="${events.content.isEmpty()}">
            <h3>No events found</h3>
            <p th:if="${q != null && !q.isBlank()}" th:text="'No results for: ' + ${q}"></p>
            <p th:if="${category != null}" th:text="'No events in category: ' + ${category}"></p>
            <p th:if="${tag != null}" th:text="'No events tagged: ' + ${tag}"></p>
            <p th:if="${q == null && category == null && tag == null}">Check back later or create one if you're an organizer!</p>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${events.totalPages > 1}">
            <a th:if="${!events.first}" th:href="@{/events(page=${events.number - 1}, category=${category}, q=${q}, tag=${tag})}"
                class="btn btn-outline">← Previous</a>
            <span class="page-info" th:text="|Page ${events.number + 1} of ${events.totalPages}|"></span>
            <a th:if="${!events.last}" th:href="@{/events(page=${events.number + 1}, category=${category}, q=${q}, tag=${tag})}"
                class="btn btn-outline">Next →</a>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Campus Event Tracker — University of Cincinnati</p>
    </footer>

    <script th:src="@{/js/app.js}"></script>
</body>

</html>
